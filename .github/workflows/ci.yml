name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lowest pipecat-ai this package allows, and the latest.
        include:
          - { python-version: "3.11", pipecat: "pipecat-ai[webrtc,silero,azure,runner]==1.15.0" }
          - { python-version: "3.12", pipecat: "pipecat-ai[webrtc,silero,azure,runner]" }
          - { python-version: "3.13", pipecat: "pipecat-ai[webrtc,silero,azure,runner]" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test,example]" "${{ matrix.pipecat }}" ruff
      - run: ruff check . && ruff format --check src tests
      - run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - run: python scripts/check_dist.py dist
