name: Publish to PyPI

# Publishing a GitHub release tagged vX.Y.Z uploads that version to PyPI with
# Trusted Publishing: no PyPI token is stored anywhere.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: pip install -e ".[test,example]" && pytest -q
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Check the tag, the files and that nothing looks like a secret
        run: python scripts/check_dist.py dist --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pipecat-meshlite/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
